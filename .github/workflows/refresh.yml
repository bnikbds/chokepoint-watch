name: Actualisation des passages
on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/**', 'index.html', 'monitor.js']
permissions:
  contents: write
concurrency:
  group: daily-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/collect.py
      - name: Conserver le relevé daté
        run: |
          git config user.name 'Chokepoint Watch bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation des sources et scores opérationnels'
            git push
          fi
